version: 2

# Routine version PRs are disabled. GitHub's separate security-update service
# may still open pull requests for vulnerable dependencies.
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    versioning-strategy: increase
    labels:
      - security/dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    labels:
      - security/dependencies
