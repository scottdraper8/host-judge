name: Contribution policy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attribution-neutral:
    name: attribution-neutral
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check contribution metadata
        if: github.event_name != 'workflow_dispatch'
        run: .github/scripts/check_contribution_attribution.py github-event "$GITHUB_EVENT_PATH"

      - name: Check branch and commit metadata
        if: github.event_name == 'workflow_dispatch'
        run: |
          .github/scripts/check_contribution_attribution.py branches
          git log -1 --format=%B > "$RUNNER_TEMP/commit-message"
          .github/scripts/check_contribution_attribution.py message-file "$RUNNER_TEMP/commit-message"
