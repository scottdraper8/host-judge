name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine whether checks are needed
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          needed=true
          if [[ "$EVENT_NAME" == pull_request ]] && git show "$BASE_SHA:.github/scripts/checks_needed.py" > "$RUNNER_TEMP/checks_needed.py"; then
            result=$(python3 "$RUNNER_TEMP/checks_needed.py" "$BASE_SHA" HEAD) || result=true
            if [[ "$result" == false ]]; then needed=false; fi
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Install actionlint
        if: steps.gate.outputs.needed == 'true'
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          path="$RUNNER_TEMP/$archive"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$path" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$path" | sha256sum --check
          tar -xzf "$path" -C "$RUNNER_TEMP" actionlint

      - name: Validate workflow definitions
        if: steps.gate.outputs.needed == 'true'
        run: |
          "$RUNNER_TEMP/actionlint" -color

      - name: Validate dependency policy
        if: steps.gate.outputs.needed == 'true'
        run: .github/scripts/check_dependency_policy.py

      - name: Test check gating
        if: steps.gate.outputs.needed == 'true'
        run: python3 -m unittest discover -s .github/scripts -p test_checks_needed.py

      - name: Check Rust formatting
        if: steps.gate.outputs.needed == 'true'
        run: cargo fmt --all -- --check

      - name: Run Clippy
        if: steps.gate.outputs.needed == 'true'
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build optimized analyzer
        if: steps.gate.outputs.needed == 'true'
        run: cargo build --release --locked
