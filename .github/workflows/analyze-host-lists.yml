name: Analyze Host Lists

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: host-list-analysis
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze with read-only credentials
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Check out repository without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Build analyzer from lockfile
        run: cargo build --release --locked

      - name: Analyze host lists
        run: target/release/host-judge --force

      - name: Validate generated state
        run: |
          jq -e '
            type == "object" and
            (.sources | type == "object") and
            (.analysis_count | type == "number") and
            (.skipped_analyses | type == "number") and
            (.last_analysis | type == "string")
          ' state.json >/dev/null
          test "$(grep -c '<!-- STATS_START -->' README.md)" -eq 1
          test "$(grep -c '<!-- STATS_END -->' README.md)" -eq 1
          test "$(stat -c '%s' README.md)" -le 1048576
          test "$(stat -c '%s' state.json)" -le 10485760

      - name: Upload generated files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-list-analysis
          path: |
            README.md
            state.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1

      - name: Summarize analysis
        if: always()
        run: |
          {
            echo "## Host Judge Analysis"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---:|"
            echo "| Configured sources | $(jq 'length' blocklists.json) |"
            echo "| Completed analyses | $(jq -r '.analysis_count' state.json) |"
            echo "| Removal candidates | $(jq '[.sources[].metadata.removal_candidate | select(. == true)] | length' state.json) |"
            echo "| Last analysis | $(jq -r '.last_analysis' state.json) |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish through a pull request
    needs: analyze
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download generated files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: host-list-analysis
          path: generated

      - name: Validate artifact boundary
        run: |
          test "$(find generated -type f -printf '%P\n' | sort | paste -sd, -)" = "README.md,state.json"
          test ! -L generated/README.md
          test ! -L generated/state.json
          jq -e '.sources | type == "object"' generated/state.json >/dev/null
          test "$(grep -c '<!-- STATS_START -->' generated/README.md)" -eq 1
          test "$(grep -c '<!-- STATS_END -->' generated/README.md)" -eq 1
          test "$(stat -c '%s' generated/README.md)" -le 1048576
          test "$(stat -c '%s' generated/state.json)" -le 10485760

      - name: Create or update analysis pull request
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          branch="automation/host-list-analysis"
          cp generated/README.md README.md
          cp generated/state.json state.json
          if git diff --quiet -- README.md state.json; then
            echo "No generated changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add README.md state.json
          test "$(git diff --cached --name-only | sort | paste -sd, -)" = "README.md,state.json"
          git commit -m "Update host-list analytics [automated]"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
          fi
          git push --force-with-lease origin "HEAD:$branch"
          pr_number=$(gh pr list --repo "$REPOSITORY" --head "$branch" --base main \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" --repo "$REPOSITORY" \
              --title "Update host-list analytics" \
              --body "Automated weekly host-list analytics and state update."
          else
            gh pr create --repo "$REPOSITORY" --base main --head "$branch" \
              --title "Update host-list analytics" \
              --body "Automated weekly host-list analytics and state update."
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Start required pull request checks
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.update.outputs.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for workflow in ci.yml security.yml codeql.yml contribution-policy.yml; do
            found=false
            for attempt in $(seq 1 15); do
              run_data=$(gh api \
                "repos/$REPOSITORY/actions/workflows/$workflow/runs?branch=automation%2Fhost-list-analysis&event=pull_request&per_page=20" \
                --jq ".workflow_runs[] | select(.head_sha == \"$HEAD_SHA\") | [.id, .status, (.conclusion // \"\")] | @tsv" \
                | head -n 1)
              if [ -n "$run_data" ]; then
                IFS=$'\t' read -r run_id run_status run_conclusion <<< "$run_data"
                if [ "$run_conclusion" = "action_required" ]; then
                  gh run rerun "$run_id" --repo "$REPOSITORY"
                else
                  echo "$workflow pull-request run is $run_status"
                fi
                found=true
                break
              fi
              sleep 2
            done
            if [ "$found" != true ]; then
              echo "No pull-request run appeared for $workflow at $HEAD_SHA" >&2
              exit 1
            fi
          done
