[package]
name = "host-judge"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Host-list relevance monitor and whitelist workspace"
license = "MIT"
repository = "https://github.com/scottdraper8/host-judge"

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.8", features = ["derive"] }
futures-util = "=0.3.34"
jiff = { version = "=1.0.1", default-features = false, features = ["std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "=2.5.8"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
