minimum_pre_commit_version: "4.6.2"
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=5120]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        files: ^\.github/(dependabot\.ya?ml|workflows/.*\.ya?ml)$
        types: [file]
      - id: check-toml
      - id: check-json
      - id: check-ast
        files: \.py$
      - id: debug-statements
        files: \.py$
      - id: detect-private-key

  - repo: https://github.com/bnjbvr/cargo-machete
    rev: ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2
    hooks:
      - id: cargo-machete
        pass_filenames: false
        files: (^|/)Cargo\.toml$|\.rs$

  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce # v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: contribution-branch
        name: validate branch metadata
        entry: .github/scripts/check_contribution_attribution.py branches
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: contribution-message
        name: validate commit metadata
        entry: .github/scripts/check_contribution_attribution.py message-file
        language: python
        stages: [commit-msg]
